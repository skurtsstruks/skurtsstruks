<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jakob stephens animated header">
  <rect width="100%" height="100%" fill="#0d1117"/>

  <style>
    .name {
      font: 700 60px 'Fira Code', monospace;
      dominant-baseline: middle;
      text-anchor: middle;
    }
    .sub {
      font: 400 24px 'Fira Code', monospace;
      fill: #e6edf3;
      text-anchor: middle;
    }
    .ghost1 { opacity: 0.18; }
    .ghost2 { opacity: 0.12; }
  </style>

  <!-- lag shadows -->
  <g transform="translate(603,84)" class="ghost1">
    <text class="name" x="0" y="0" fill="#00ff88">jakob stephens</text>
  </g>
  <g transform="translate(597,76)" class="ghost2">
    <text class="name" x="0" y="0" fill="#ffffff">jakob stephens</text>
  </g>

  <!-- centered colored letters -->
  <g transform="translate(600,80)">
    <text class="name" x="-245" y="0" fill="#00ff88">j</text>
    <text class="name" x="-205" y="0" fill="#ffffff">a</text>
    <text class="name" x="-165" y="0" fill="#111111">k</text>
    <text class="name" x="-125" y="0" fill="#00ff88">o</text>
    <text class="name" x="-85"  y="0" fill="#ffffff">b</text>

    <text class="name" x="-5"   y="0" fill="#111111">s</text>
    <text class="name" x="35"   y="0" fill="#00ff88">t</text>
    <text class="name" x="75"   y="0" fill="#ffffff">e</text>
    <text class="name" x="115"  y="0" fill="#111111">p</text>
    <text class="name" x="155"  y="0" fill="#00ff88">h</text>
    <text class="name" x="195"  y="0" fill="#ffffff">e</text>
    <text class="name" x="235" y="0" fill="#3d444d">n</text>
    <text class="name" x="275"  y="0" fill="#00ff88">s</text>
  </g>

  <!-- animated subtitles -->
  <g transform="translate(600,165)">
    <text class="sub" x="0" y="0" opacity="1">
      network engineering
      <animate attributeName="opacity" values="1;1;0;0;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text class="sub" x="0" y="0" opacity="0">
      cloud infrastructure
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text class="sub" x="0" y="0" opacity="0">
      linux systems
      <animate attributeName="opacity" values="0;0;0;0;1;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(600,205)">
    <text class="sub" x="0" y="0" fill="#9be9a8" opacity="1">
      observability // reliability // operations
      <animate attributeName="opacity" values="1;1;0;0;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text class="sub" x="0" y="0" fill="#e6edf3" opacity="0">
      infrastructure // monitoring // defense systems
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text class="sub" x="0" y="0" fill="#00ff88" opacity="0">
      transition in progress
      <animate attributeName="opacity" values="0;0;0;0;1;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
